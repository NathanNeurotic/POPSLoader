name: Capture exact MMCE handoff triple

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: agent/fix-mmce-mx4-first-entry

      - name: Apply validation patch
        run: |
          python3 tools/fix_storage_v4_applicator_quotes.py
          python3 tools/fix_storage_v4_t25_input.py
          python3 tools/fix_storage_v4_t25_diag.py
          python3 tools/apply_storage_fix_v4.py

      - name: Install Lua runtime bridge
        run: |
          python3 -m pip install --quiet lupa 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages lupa

      - name: Capture harness output
        id: harness
        continue-on-error: true
        run: |
          python3 tools/host_harness.py > harness-v3.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload harness output
        uses: actions/upload-artifact@v4
        with:
          name: exact-mmce-handoff-log
          path: harness-v3.log

      - name: Preserve harness result
        run: |
          cat harness-v3.log
          test "${{ steps.harness.outputs.exit_code }}" = "0"
