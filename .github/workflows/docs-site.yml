name: Docs Site

# Rebuilds the published documentation site from .research/build_site.py.
#
# WHY THIS EXISTS: the popsloader/*.html pages MIRROR this repo's markdown, and until
# 2026-07-28 the only thing that could regenerate them was a script on one person's
# machine, tracked in no branch. They silently went a full release era stale -- still
# describing BETA-12 as current a month after 1.1.0 shipped, and linking to a branch
# that had been renamed away. Edit STATE.md, and the published copy of STATE.md just
# quietly got wronger. This closes that loop.
#
# Mirrors the rolling-release pattern: everything builds and gates on every trigger,
# but ONLY a push to `dev` deploys. A pull request gets the same build and the same
# audit gate and publishes nothing.

on:
  push:
    branches:
      - dev
    paths:
      # the markdown the mirrors are generated FROM
      - '*.md'
      - 'docs/**.md'
      # the generator and its corpus
      - '.research/**'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - '*.md'
      - 'docs/**.md'
      - '.research/**'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-site
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild the site and gate it
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install python-markdown
        shell: bash
        run: |
          set -eu
          python3 -m pip install --quiet markdown 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages markdown

      - name: Build
        shell: bash
        working-directory: .research
        run: |
          set -eu
          POPSLOADER_REPO="$GITHUB_WORKSPACE" python3 build_site.py

      - name: Audit (hard gate)
        shell: bash
        working-directory: .research
        run: |
          set -eu
          python3 audit_site.py

      # Cheap invariants the audit does not cover. audit_site.py validates relative
      # links only and returns true for every http(s) href, which is exactly how 15
      # dead blob/BETA-13-PLAY/ links shipped unnoticed.
      - name: Check emitted GitHub links name a live branch
        shell: bash
        run: |
          set -eu
          git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | sort -u > /tmp/branches
          BAD=0
          for b in $(grep -rhoE 'github\.com/[^/]+/[^/]+/blob/([^/"]+)/' .research/site --include='*.html' \
                     | sed -E 's#.*/blob/([^/"]+)/#\1#' | sort -u); do
            grep -qx "$b" /tmp/branches || { echo "::error::site links to branch '$b', which does not exist on origin"; BAD=1; }
          done
          [ "$BAD" = "0" ] || exit 1

      - name: Check every hosted download is still linked
        shell: bash
        run: |
          set -eu
          cd .research/site
          MISSING=0
          for f in downloads/*; do
            grep -q "$(basename "$f")" downloads.html || { echo "::error::$f is hosted but not linked from downloads.html"; MISSING=1; }
          done
          [ "$MISSING" = "0" ] || exit 1

      - name: Deploy to gh-pages
        # Same gate the rolling channel uses: a PR builds and is checked, but only a
        # push to dev republishes. Never let a PR move a published channel.
        if: success() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1
          git worktree add ../ghp origin/gh-pages
          # Overlay, never delete-then-copy: gh-pages carries files the build does not
          # emit, and a sync-by-deletion would drop them.
          cp -r .research/site/* ../ghp/
          cp .research/site/.nojekyll ../ghp/.nojekyll
          cd ../ghp
          git add -A
          if git diff --cached --quiet; then
            echo "site unchanged; nothing to publish"
            exit 0
          fi
          git commit \
            -m "site: rebuild from ${GITHUB_SHA::7}" \
            -m "Regenerated by .github/workflows/docs-site.yml from the tracked markdown and .research corpus. audit_site.py clean; every hosted download linked; every emitted GitHub branch link resolves."
          git push origin HEAD:gh-pages
