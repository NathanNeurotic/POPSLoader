name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - v*
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    strategy:
      fail-fast: false
      matrix:
        variant: [mmce, mx4sio, hdd]
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache build-base git bash p7zip findutils coreutils

      - name: Workaround permissions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R root:root .

      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build info
        shell: sh
        run: |
          set -eu
          COMMIT_SHORT="$(echo "$GITHUB_SHA" | cut -c1-7)"
          BUILD_UTC="$(date -u '+%Y-%m-%d %H:%MZ')"
          printf "%s\n%s\n" "$COMMIT_SHORT" "$BUILD_UTC" > bin/POPSLDR/BUILD_INFO.txt

      - name: Compile and package (${{ matrix.variant }})
        shell: sh
        run: |
          set -eu
          make clean elfloader all package VARIANT=${{ matrix.variant }}

      - name: Upload artifact (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: POPSLoader-${{ matrix.variant }}
          path: POPSLoader-${{ matrix.variant }}.7z
