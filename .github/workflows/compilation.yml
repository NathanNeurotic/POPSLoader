name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - v*
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache build-base git bash findutils coreutils

      - name: Workaround permission issue
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate build info
        shell: sh
        run: |
          set -eu
          COMMIT_SHORT="$(echo "$GITHUB_SHA" | cut -c1-7)"
          BUILD_UTC="$(date -u '+%Y-%m-%d %H:%MZ')"
          printf "%s\n%s\n" "$COMMIT_SHORT" "$BUILD_UTC" > bin/POPSLDR/BUILD_INFO.txt
          cat bin/POPSLDR/BUILD_INFO.txt

      - name: Compile project
        run: |
          make clean elfloader all

      - name: Upload artifact (no release)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: POPSLOADER-ELF
          path: bin/POPSLOADER.ELF
          if-no-files-found: error
