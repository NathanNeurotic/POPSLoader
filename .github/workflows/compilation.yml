name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - v*
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache build-base git bash p7zip findutils coreutils

      - name: Workaround permission issue
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate build info
        shell: sh
        run: |
          set -eu
          COMMIT_SHORT="$(echo "$GITHUB_SHA" | cut -c1-7)"
          BUILD_UTC="$(date -u '+%Y-%m-%d %H:%MZ')"
          printf "%s
%s
" "$COMMIT_SHORT" "$BUILD_UTC" > bin/POPSLDR/BUILD_INFO.txt
          cat bin/POPSLDR/BUILD_INFO.txt

      - name: Build + package (mx4sio boot variant)
        shell: sh
        run: |
          set -eu
          make clean elfloader all package VARIANT=mx4sio

      - name: Locate and normalize artifact (mx4sio)
        shell: sh
        run: |
          set -eu
          OUT="./POPSLoader-mx4sio.7z"

          echo "== Searching for .7z artifacts (mx4sio) =="
          find . -maxdepth 6 -type f -name '*.7z' -print || true

          # Prefer an exact name match first (any location)
          EXACT="$(find . -maxdepth 6 -type f -name 'POPSLoader.7z' -print | head -n 1 || true)"

          if [ -n "$EXACT" ]; then
            echo "Found exact artifact: $EXACT"
            cp -f "$EXACT" "$OUT"
          else
            # Otherwise pick the newest .7z produced
            NEWEST="$(find . -maxdepth 6 -type f -name '*.7z' -print -exec ls -t {} + 2>/dev/null | head -n 1 || true)"

            if [ -z "$NEWEST" ]; then
              echo "ERROR: No .7z artifact found after mx4sio build."
              exit 1
            fi

            echo "No exact POPSLoader.7z found. Using newest .7z: $NEWEST"
            cp -f "$NEWEST" "$OUT"
          fi

          echo "== Final normalized artifact (mx4sio) =="
          ls -lah "$OUT"

      - name: Build + package (mmce boot variant)
        shell: sh
        run: |
          set -eu
          make clean elfloader all package VARIANT=mmce

      - name: Locate and normalize artifact (mmce)
        shell: sh
        run: |
          set -eu
          OUT="./POPSLoader-mmce.7z"

          echo "== Searching for .7z artifacts (mmce) =="
          find . -maxdepth 6 -type f -name '*.7z' -print || true

          # Prefer an exact name match first (any location)
          EXACT="$(find . -maxdepth 6 -type f -name 'POPSLoader.7z' -print | head -n 1 || true)"

          if [ -n "$EXACT" ]; then
            echo "Found exact artifact: $EXACT"
            cp -f "$EXACT" "$OUT"
          else
            # Otherwise pick the newest .7z produced
            NEWEST="$(find . -maxdepth 6 -type f -name '*.7z' -print -exec ls -t {} + 2>/dev/null | head -n 1 || true)"

            if [ -z "$NEWEST" ]; then
              echo "ERROR: No .7z artifact found after mmce build."
              exit 1
            fi

            echo "No exact POPSLoader.7z found. Using newest .7z: $NEWEST"
            cp -f "$NEWEST" "$OUT"
          fi

          echo "== Final normalized artifact (mmce) =="
          ls -lah "$OUT"

      - name: Upload artifacts (both boot variants)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: POPSLoader-dualboot
          path: |
            POPSLoader-mx4sio.7z
            POPSLoader-mmce.7z
          if-no-files-found: error
          compression-level: 0
