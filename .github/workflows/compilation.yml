name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - v*
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache build-base git bash p7zip findutils coreutils

      - name: Workaround permission issue
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate build info
        shell: sh
        run: |
          set -eu
          COMMIT_SHORT="$(echo "$GITHUB_SHA" | cut -c1-7)"
          BUILD_UTC="$(date -u '+%Y-%m-%d %H:%MZ')"
          printf "%s\n%s\n" "$COMMIT_SHORT" "$BUILD_UTC" > bin/POPSLDR/BUILD_INFO.txt
          cat bin/POPSLDR/BUILD_INFO.txt

      - name: Compile project
        run: |
          make clean elfloader all package

      - name: Locate and normalize APP_POPSLOADER.zip
        shell: sh
        run: |
          set -eu

          echo "== Workspace contents (top-level) =="
          ls -lah

          EXACT="$(find . -maxdepth 6 -type f -name 'APP_POPSLOADER.zip' -print | head -n 1 || true)"
          if [ -z "$EXACT" ]; then
            echo "ERROR: APP_POPSLOADER.zip not found after build."
            exit 1
          fi

          cp -f "$EXACT" "./APP_POPSLOADER.zip"
          echo "== Final normalized artifact =="
          ls -lah "./APP_POPSLOADER.zip"

      - name: Upload artifact (no release)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: APP_POPSLOADER
          path: APP_POPSLOADER.zip
          if-no-files-found: error
          compression-level: 0
