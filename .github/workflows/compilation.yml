name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - v*
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache build-base git bash p7zip findutils coreutils

      - name: Workaround permission issue
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Python (inside container)
        shell: bash
        run: |
          set -euo pipefail
          echo "PATH=$PATH"
          # If python3 already works, keep it.
          if command -v python3 >/dev/null 2>&1 && python3 -V >/dev/null 2>&1; then
            echo "python3 already present:"
            python3 -V
            exit 0
          fi

          echo "python3 not usable; attempting install..."

          # Alpine
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache python3 py3-pip
            python3 -V
            exit 0
          fi

          # Debian/Ubuntu
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-pip
            python3 -V
            exit 0
          fi

          # Fallback: try yum/dnf if ever used
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y python3 python3-pip
            python3 -V
            exit 0
          fi
          if command -v yum >/dev/null 2>&1; then
            yum install -y python3 python3-pip
            python3 -V
            exit 0
          fi

          echo "ERROR: Could not install python3 (unknown base image)."
          exit 1

      - name: Build
        env:
          PYTHON: python3
        run: |
          make clean elfloader all package

      - name: Locate and normalize POPSLoader.zip
        shell: sh
        run: |
          set -eu

          echo "== Workspace contents (top-level) =="
          ls -lah

          echo "== Searching for .zip artifacts (up to 6 levels deep) =="
          # Show all matches for debugging
          find . -maxdepth 6 -type f -name '*.zip' -print || true

          # Prefer an exact name match first (any location)
          EXACT="$(find . -maxdepth 6 -type f -name 'POPSLoader.zip' -print | head -n 1 || true)"

          if [ -n "$EXACT" ]; then
            echo "Found exact artifact: $EXACT"
            cp -f "$EXACT" "./POPSLoader.zip"
          else
            # Otherwise pick the newest .zip produced (common when Makefile names differ)
            NEWEST="$(find . -maxdepth 6 -type f -name '*.zip' -print -exec ls -t {} + 2>/dev/null | head -n 1 || true)"

            if [ -z "$NEWEST" ]; then
              echo "ERROR: No .zip artifact found after build."
              echo "Hint: your Makefile 'package' target may be outputting a different extension or skipping packaging."
              exit 1
            fi

            echo "No exact POPSLoader.zip found. Using newest .zip: $NEWEST"
            cp -f "$NEWEST" "./POPSLoader.zip"
          fi

          echo "== Final normalized artifact =="
          ls -lah "./POPSLoader.zip"

      - name: Upload artifact (no release)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: POPSLoader
          path: POPSLoader.zip
          if-no-files-found: error
          compression-level: 0
