name: CI

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types:
      - run_build

jobs:
  # Boot-brick gate on a plain glibc runner: the ps2dev container is Alpine/musl
  # where lupa has no wheel (its in-container step self-skips), so the harness
  # runs HERE and the build depends on it -- an un-bootable embedded-Lua change
  # (the d4b04be attach-before-init class) fails this job before anything ships.
  # Infra failures (pip outage) skip cleanly; only real harness failures gate.
  lua-harness:
    name: Host-execute embedded Lua (boot-brick gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Test PNG decoder pixels and alpha
        shell: bash
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y g++ pkg-config libpng-dev
          python3 tools/png_decoder_harness.py
      - name: Run the host harness
        shell: bash
        run: |
          set -eu
          python3 -m pip install --quiet lupa 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages lupa \
            || { echo "lupa install failed on ubuntu (infra); skipping"; exit 0; }
          python3 tools/host_harness.py
          python3 tools/test_udpfs_config_runtime.py
      # Mechanical doc/source drift: settings-key counts, harness count, version
      # stamps, translator hand-off integrity, and phrases describing behaviour that
      # was deleted. Pure stdlib, no install step, so it cannot fail on infra.
      # It sat unwired and red for months, which is why STATE.md was still claiming
      # 22 settings keys and 39 harness tests against a source writing 23 and 41.
      - name: Verify docs against source
        shell: bash
        run: python3 tools/docs_verify.py
      - name: Verify Okeanos UDPFS integration and pinned binaries
        shell: bash
        run: python3 tools/test_udpfs_integration.py

  build:
    needs: lua-harness
    runs-on: ubuntu-latest
    container:
      # Pinned to v2.0.0 (2026-05-17 release) so unrelated upstream
      # toolchain changes don't silently break our builds. To upgrade:
      # check https://hub.docker.com/r/ps2dev/ps2dev/tags, verify the
      # target tag builds POPSLoader locally (or via a draft PR), then
      # update this line.
      image: ps2dev/ps2dev:v2.0.0

    steps:
      - name: Install dependencies
        shell: sh
        run: |
          set -eu
          apk add --no-cache build-base git bash p7zip findutils coreutils zip unzip python3 lua5.4

      - name: Workaround permission issue
        shell: sh
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify pinned ata_bd.irx checksum
        shell: sh
        run: |
          set -eu
          # The embedded ata_bd is pinned to R3Z v4.70's probe-fixed binary
          # (HW-proven on 4TB GPT internal exFAT, 2026-07-20); the SDK copy
          # must not silently replace it. See the Makefile ata_bd rule.
          echo "16c5d9f00d64be5ea4848b53da89bb5f89a54004957bae47d01dee3c354742f4  iop/embed/ata_bd.irx" | sha256sum -c -

      - name: Generate build info
        shell: sh
        run: |
          set -eu
          COMMIT_SHORT="$(echo "$GITHUB_SHA" | cut -c1-7)"
          BUILD_UTC="$(date -u '+%Y-%m-%d %H:%MZ')"
          printf "%s\n%s\n" "$COMMIT_SHORT" "$BUILD_UTC" > bin/POPSLDR/BUILD_INFO.txt
          cat bin/POPSLDR/BUILD_INFO.txt

      - name: Validate bundled Lua sources (syntax/newline)
        shell: bash
        run: |
          set -eu
          # etc/boot.lua is the bootstrap that runs on POPSLoader EE init.
          # bin/POPSLDR/*.lua are embedded into POPSLOADER.ELF via bin2c and
          # require()'d at runtime. All are embedded as raw bytes, so syntax
          # errors otherwise only surface on real hardware at boot time.
          LUA_FILES="etc/boot.lua bin/POPSLDR/system.lua bin/POPSLDR/ui.lua bin/POPSLDR/images.lua"
          for f in $LUA_FILES; do
            [ -f "$f" ] || { echo "ERROR: $f not found" >&2; exit 1; }
          done
          # Trailing-newline check is critical only for etc/boot.lua because
          # bin2c-embedded files don't depend on file termination, but the
          # boot.lua runner is fussier about it.
          LAST_BYTE_HEX="$(tail -c 1 etc/boot.lua | od -An -tx1 | tr -d '[:space:]')"
          [ "$LAST_BYTE_HEX" = "0a" ] || { echo "ERROR: etc/boot.lua must end with newline (0x0A)" >&2; exit 1; }
          # lua5.4 is installed as a build dependency above, so this gate is LIVE.
          # It used to silently skip: the ps2dev image ships no bare `luac`, so the
          # old `command -v luac` check always fell through to the skip branch and
          # embedded-Lua syntax errors shipped unseen (they only crash on real PS2
          # hardware). Alpine installs the versioned `luac5.4`, so probe for it and
          # HARD-FAIL rather than ever skipping again.
          LUAC=""
          for cand in luac5.4 luac luac5.3; do
            if command -v "$cand" >/dev/null 2>&1; then LUAC="$cand"; break; fi
          done
          if [ -n "$LUAC" ]; then
            for f in $LUA_FILES; do
              "$LUAC" -p "$f" || { echo "ERROR: $LUAC -p failed for $f" >&2; exit 1; }
            done
            echo "Lua syntax validated with $LUAC"
          else
            LUA=""
            for cand in lua5.4 lua lua5.3; do
              if command -v "$cand" >/dev/null 2>&1; then LUA="$cand"; break; fi
            done
            if [ -n "$LUA" ]; then
              for f in $LUA_FILES; do
                "$LUA" -e "assert(loadfile('$f'))" || { echo "ERROR: loadfile failed for $f" >&2; exit 1; }
              done
              echo "Lua syntax validated with $LUA (loadfile)"
            else
              echo "ERROR: lua5.4 is a build dependency but no luac/lua was found -- the Lua syntax gate must not silently skip" >&2
              exit 1
            fi
          fi

      # Runtime gate on top of the syntax gate above: EXECUTES system.lua (and
      # ui.lua at its real require point) under a mocked PS2 environment, then a
      # functional battery. Catches the class luac -p cannot: attach-before-init
      # load-order bricks (d4b04be shipped un-bootable rolling builds), nil-global
      # calls, load-time type errors. Environment problems (no lupa wheel for this
      # container) SKIP cleanly; a real harness failure HARD-FAILS the build.
      - name: Host-execute the embedded Lua (boot-brick gate)
        shell: bash
        run: |
          set -eu
          if ! command -v python3 >/dev/null 2>&1; then echo "python3 unavailable; skipping host harness"; exit 0; fi
          if ! python3 -c "import lupa" 2>/dev/null; then
            python3 -m pip install --quiet lupa 2>/dev/null               || python3 -m pip install --quiet --break-system-packages lupa 2>/dev/null               || pip3 install --quiet lupa 2>/dev/null               || { echo "lupa not installable in this container; skipping host harness"; exit 0; }
          fi
          python3 -c "import lupa" 2>/dev/null || { echo "lupa import failed post-install; skipping host harness"; exit 0; }
          python3 tools/host_harness.py

      - name: Compile project
        shell: sh
        run: |
          set -eu
          make clean elfloader all

      - name: Verify embedded build identity
        shell: sh
        run: |
          set -eu

          require_marker() {
            marker="$1"
            target="$2"
            if ! grep -aF "$marker" "$target" >/dev/null; then
              echo "ERROR: expected embedded marker '$marker' missing from $target" >&2
              exit 1
            fi
          }

          [ -f bin/enceladus.elf ] || { echo "ERROR: bin/enceladus.elf missing after build" >&2; exit 1; }
          [ -f src/elf_loader/loader.c ] || { echo "ERROR: generated embedded loader blob missing" >&2; exit 1; }
          if [ ! src/elf_loader/loader.c -nt src/elf_loader/src/loader/src/loader.c ]; then
            echo "WARN: loader.c timestamp is not newer than loader source; validating content parity" >&2
            TMP_LOADER_C="$(mktemp)"
            "${PS2SDK}/bin/bin2c" src/elf_loader/src/loader/bin/loader.elf "$TMP_LOADER_C" loader_elf
            if ! cmp -s src/elf_loader/loader.c "$TMP_LOADER_C"; then
              echo "ERROR: embedded loader blob content does not match src/elf_loader/src/loader/bin/loader.elf" >&2
              rm -f "$TMP_LOADER_C"
              exit 1
            fi
            rm -f "$TMP_LOADER_C"
          fi

          require_marker "Exec path:" bin/enceladus.elf
          require_marker "PrepareForColdExternalELFLaunch" bin/enceladus.elf
          require_marker "BOOT.ELF launch failed" bin/enceladus.elf

      - name: Create complete PS1 POPSLoader ZIP and flat PSU
        shell: sh
        run: |
          set -eu
          # Pin the reference install assets so POPS and EMBER cannot change
          # unexpectedly when upstream updates. Update only after review.
          RIPTOPL_SHA=ebb62e1d5db8099bb5b51b4b430a4d1914529bd2
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/NathanNeurotic/Open-PS2-Loader.git /tmp/riptopl-kit
          git -C /tmp/riptopl-kit checkout --quiet "$RIPTOPL_SHA" -- POPS EMBER Example/APP_RIPTOPL-OFFICIALROLLING-VERSION.ZIP/POPS
          rm -rf dist_root POPSLOADER.zip PS1_POPSLOADER.psu
          mkdir -p dist_root/APPS/PS1_POPSLOADER dist_root/POPS dist_root/EMBER/games/ExampleGame
          test -s bin/POPSLOADER.ELF
          test -s bin/POPSLDR/POPSTARTER.ELF
          cp bin/POPSLOADER.ELF dist_root/APPS/PS1_POPSLOADER/POPSLOADER.ELF
          for f in POPSTARTER.ELF icon.sys list.icn copy.icn del.icn title.cfg APPINFO.PBT; do
            test -s "bin/POPSLDR/$f"
            cp "bin/POPSLDR/$f" "dist_root/APPS/PS1_POPSLOADER/$f"
          done
          cp -a /tmp/riptopl-kit/POPS/. dist_root/POPS/
          cp -a /tmp/riptopl-kit/EMBER/. dist_root/EMBER/
          for f in CHEATS.TXT IGR_BG.TM2 IGR_NO.TM2 IGR_YES.TM2 POPSTARTER.KELF TROJAN_7.BIN; do
            test -s "/tmp/riptopl-kit/Example/APP_RIPTOPL-OFFICIALROLLING-VERSION.ZIP/POPS/$f"
            cp "/tmp/riptopl-kit/Example/APP_RIPTOPL-OFFICIALROLLING-VERSION.ZIP/POPS/$f" "dist_root/POPS/$f"
          done
          test -s dist_root/EMBER/ember.elf
          test -s dist_root/EMBER/LICENSE-BETA.txt
          test ! -e dist_root/EMBER/bios.bin
          # ExampleGame.bin is deliberately empty: a game-image placement
          # illustration, not copyrighted content or a bootable PS1 game.
          printf 'FILE "ExampleGame.bin" BINARY\n  TRACK 01 MODE2/2352\n    INDEX 01 00:00:00\n' > dist_root/EMBER/games/ExampleGame/ExampleGame.cue
          : > dist_root/EMBER/games/ExampleGame/ExampleGame.bin
          python3 tools/package_psu.py build dist_root/APPS/PS1_POPSLOADER dist_root/PS1_POPSLOADER.psu
          cp dist_root/PS1_POPSLOADER.psu PS1_POPSLOADER.psu
          (cd dist_root && find APPS POPS EMBER -type f | LC_ALL=C sort | zip -X -9 ../POPSLOADER.zip -@ >/dev/null)
          (cd dist_root && zip -X -9 ../POPSLOADER.zip PS1_POPSLOADER.psu >/dev/null)

      - name: Verify complete release package
        shell: sh
        run: |
          set -eu
          python3 tools/package_psu.py verify dist_root/APPS/PS1_POPSLOADER PS1_POPSLOADER.psu
          python3 - <<'PY'
          import pathlib, zipfile
          expected = {"POPSLOADER.ELF", "POPSTARTER.ELF", "icon.sys", "list.icn",
                      "copy.icn", "del.icn", "title.cfg", "APPINFO.PBT"}
          with zipfile.ZipFile("POPSLOADER.zip") as z:
              assert z.testzip() is None
              names = [n for n in z.namelist() if not n.endswith("/")]
              assert len(names) == len(set(names))
              apps = {n.split("/")[-1] for n in names if n.startswith("APPS/PS1_POPSLOADER/")}
              assert apps == expected, (apps, expected)
              assert z.read("PS1_POPSLOADER.psu") == pathlib.Path("PS1_POPSLOADER.psu").read_bytes()
              for n in expected:
                  assert z.read("APPS/PS1_POPSLOADER/" + n) == pathlib.Path("dist_root/APPS/PS1_POPSLOADER", n).read_bytes()
              for name in ("EMBER/ember.elf", "EMBER/LICENSE-BETA.txt",
                           "EMBER/games/ExampleGame/ExampleGame.cue",
                           "EMBER/games/ExampleGame/ExampleGame.bin",
                           "POPS/POPSTARTER.ELF", "POPS/PATCH_5.BIN",
                           "POPS/usbd.irx.ilink", "POPS/usbhdfsd.irx.ilink"):
                  assert name in names, name
              assert not any(n.lower() == "ember/bios.bin" for n in names)
              assert {p.name for p in pathlib.Path("dist_root/POPS").iterdir()} <= {
                  n.split("/", 1)[1].split("/", 1)[0] for n in names if n.startswith("POPS/")
              }
              print("Verified: flat PSU, exact app payload, complete POPS and Ember kit")
          PY

      - name: Upload artifact (no release)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: POPSLOADER
          path: |\n            POPSLOADER.zip\n            PS1_POPSLOADER.psu
          if-no-files-found: error
          compression-level: 0
