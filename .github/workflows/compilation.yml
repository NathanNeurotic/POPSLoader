name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - v*
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - boot_variant: standard
            artifact_name: PS1_POPSLOADER.ZIP
            upload_name: POPSLoader-standard
          - boot_variant: mmce
            artifact_name: PS1_POPSLOADER-MMCE.ZIP
            upload_name: POPSLoader-mmce
          - boot_variant: mx4sio
            artifact_name: PS1_POPSLOADER-MX4SIO.ZIP
            upload_name: POPSLoader-mx4sio
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache build-base git bash p7zip findutils coreutils

      - name: Workaround permission issue
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate build info
        shell: sh
        run: |
          set -eu
          COMMIT_SHORT="$(echo "$GITHUB_SHA" | cut -c1-7)"
          BUILD_UTC="$(date -u '+%Y-%m-%d %H:%MZ')"
          printf "%s\n%s\n" "$COMMIT_SHORT" "$BUILD_UTC" > bin/POPSLDR/BUILD_INFO.txt
          cat bin/POPSLDR/BUILD_INFO.txt

      - name: Compile project variant
        shell: sh
        run: |
          set -eu
          make clean elfloader all package-variant BOOT_VARIANT=${{ matrix.boot_variant }}

      - name: Verify variant artifact
        shell: sh
        run: |
          set -eu
          test -f "bin/${{ matrix.artifact_name }}"
          ls -lah "bin/${{ matrix.artifact_name }}"

      - name: Upload artifact (no release)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload_name }}
          path: bin/${{ matrix.artifact_name }}
          if-no-files-found: error
          compression-level: 0
