name: Apply storage readiness follow-up

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: apply-storage-readiness-followup
  cancel-in-progress: true

jobs:
  host-validation:
    name: Host regression and handoff battery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean follow-up branch
        uses: actions/checkout@v5
        with:
          ref: agent/fix-mmce-mx4-after-storage-revert
          fetch-depth: 0

      - name: Apply targeted follow-up
        run: python3 tools/apply_storage_readiness_followup.py

      - name: Install Lua runtime bridge
        run: |
          python3 -m pip install --quiet lupa 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages lupa

      - name: Run host harness
        run: python3 tools/host_harness.py

      - name: Check patch cleanliness
        run: git diff --check

  ps2-build-validation:
    name: PS2 build and Lua syntax
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:v2.0.0
    steps:
      - name: Install dependencies
        shell: sh
        run: apk add --no-cache build-base git bash p7zip findutils coreutils zip unzip python3 lua5.4 ca-certificates

      - name: Mark checkout safe
        shell: sh
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout clean follow-up branch
        uses: actions/checkout@v5
        with:
          ref: agent/fix-mmce-mx4-after-storage-revert
          fetch-depth: 0

      - name: Apply targeted follow-up
        shell: sh
        run: python3 tools/apply_storage_readiness_followup.py

      - name: Validate Lua syntax
        shell: sh
        run: luac5.4 -p etc/boot.lua bin/POPSLDR/system.lua bin/POPSLDR/ui.lua bin/POPSLDR/images.lua

      - name: Compile project
        shell: sh
        run: make clean elfloader all

      - name: Check patch cleanliness
        shell: sh
        run: git diff --check

  commit-fix:
    name: Commit validated follow-up
    needs:
      - host-validation
      - ps2-build-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean follow-up branch
        uses: actions/checkout@v5
        with:
          ref: agent/fix-mmce-mx4-after-storage-revert
          fetch-depth: 0

      - name: Apply targeted follow-up
        run: python3 tools/apply_storage_readiness_followup.py

      - name: Remove temporary applicator
        run: |
          rm -f tools/apply_storage_readiness_followup.py
          rm -f .github/workflows/apply-storage-readiness-followup.yml

      - name: Commit and push
        run: |
          set -eu
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/POPSLDR/system.lua etc/boot.lua tools/host_harness.py tools/apply_storage_readiness_followup.py .github/workflows/apply-storage-readiness-followup.yml
          git commit -m "fix(storage): harden MMCE and MX4SIO after storage revert"
          git push origin HEAD:agent/fix-mmce-mx4-after-storage-revert
