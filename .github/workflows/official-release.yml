name: Official Release (post-CI)

# Publish 1.2.3 only after the default-branch CI has built and verified the
# exact master SHA. Reuse its tested installer ZIP instead of re-building a
# potentially different binary or publishing an unchecked artifact.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  actions: read
  contents: write

concurrency:
  group: official-release-1.2.3
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact CI-verified source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Download same-run CI release artifact
        uses: actions/download-artifact@v4
        with:
          name: POPSLOADER
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release version and prepare canonical assets
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -s POPSLOADER.zip
          unzip -tq POPSLOADER.zip
          grep -Fxq 'POPSLDR_VER = "v1.2.3"' etc/boot.lua
          grep -Fxq 'Version=1.2.3' bin/POPSLDR/title.cfg
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          mv POPSLOADER.zip PS1_POPSLOADER.zip
          unzip -p PS1_POPSLOADER.zip APPS/PS1_POPSLOADER/POPSLOADER.ELF > POPSLOADER.ELF
          test -s POPSLOADER.ELF
          test -s PS1_POPSLOADER.psu
          python3 - <<'PY'
          import tempfile, pathlib, zipfile, subprocess
          with tempfile.TemporaryDirectory() as d, zipfile.ZipFile('PS1_POPSLOADER.zip') as z:
              for name in ('POPSLOADER.ELF', 'POPSTARTER.ELF', 'icon.sys', 'list.icn', 'copy.icn', 'del.icn', 'title.cfg', 'APPINFO.PBT'):
                  pathlib.Path(d, name).write_bytes(z.read('APPS/PS1_POPSLOADER/' + name))
              subprocess.run(['python3', 'tools/package_psu.py', 'verify', d, 'PS1_POPSLOADER.psu'], check=True)
          PY
          printf 'POPSLoader 1.2.3\nSource: %s\nCI run: %s\n' "$VERIFIED_SHA" \
            'https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}' > BUILD-MANIFEST.txt
          sha256sum POPSLOADER.ELF PS1_POPSLOADER.zip PS1_POPSLOADER.psu BUILD-MANIFEST.txt > SHA256SUMS.txt
      - name: Publish verified official release once
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh release view 1.2.3 >/dev/null 2>&1; then
            echo "1.2.3 already published; leaving the immutable official release unchanged"
            exit 0
          fi
          gh release create 1.2.3 \
            POPSLOADER.ELF PS1_POPSLOADER.zip PS1_POPSLOADER.psu BUILD-MANIFEST.txt SHA256SUMS.txt \
            --target "$VERIFIED_SHA" \
            --title "POPSLoader 1.2.3" \
            --notes-file OFFICIAL_NOTES.md \
            --latest
