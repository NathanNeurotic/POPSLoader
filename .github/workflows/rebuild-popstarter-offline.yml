name: Rebuild POPStarter offline archive
on:
  push:
    branches:
      - docs/restore-popstarter-downloads
    paths:
      - 'downloads/*.7z'
permissions:
  contents: write
concurrency:
  group: rebuild-popstarter-original-archives
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify recovered archives and rebuild complete offline ZIP
        run: python3 .github/scripts/rebuild_offline_archive.py
      - name: Commit regenerated offline ZIP if necessary
        run: |
          if git diff --quiet -- popstarter-docs-archive.zip; then
            echo "No offline archive change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add popstarter-docs-archive.zip
          git commit -m "docs: include recovered archives in complete offline POPStarter ZIP"
          git push origin HEAD:docs/restore-popstarter-downloads
