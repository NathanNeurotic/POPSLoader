name: Apply storage hardware follow-up

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: apply-storage-hardware-follow-up
  cancel-in-progress: true

jobs:
  host-validation:
    name: Host regression battery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: agent/fix-mmce-mx4-first-entry
          fetch-depth: 0

      - name: Apply hardware follow-up patch
        run: python3 tools/apply_storage_fix_v2.py

      - name: Install Lua runtime bridge
        run: |
          python3 -m pip install --quiet lupa 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages lupa

      - name: Run host harness
        run: python3 tools/host_harness.py

      - name: Validate source invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('src/main.cpp').read_text()
          body = main[main.index('int main(int argc, char * argv[])'):]
          pre_graphics = body[:body.index('initGraphics();')]
          assert 'EnsureUsbMass();' not in pre_graphics
          assert 'EnsureAtaBdm();' not in pre_graphics
          cpp = Path('src/luasystem.cpp').read_text()
          ata = cpp[cpp.index('bool EnsureAtaBdm()'):cpp.index('static int lua_ata_init')]
          assert ata.index('EnsureBDMFatFs()') < ata.index('EnsureDev9()') < ata.index('ata_bd.irx')
          system = Path('bin/POPSLDR/system.lua').read_text()
          assert 'local function FileBytesMatch' in system
          assert 'FileBytesMatch(dest, bytes)' in system
          print('source invariants passed')
          PY

      - name: Check patch cleanliness
        run: git diff --check

  ps2-build-validation:
    name: PS2 build and Lua syntax
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:v2.0.0
    steps:
      - name: Install dependencies
        shell: sh
        run: apk add --no-cache build-base git bash p7zip findutils coreutils zip unzip python3 lua5.4 ca-certificates

      - name: Mark checkout safe
        shell: sh
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: agent/fix-mmce-mx4-first-entry
          fetch-depth: 0

      - name: Apply hardware follow-up patch
        shell: sh
        run: python3 tools/apply_storage_fix_v2.py

      - name: Validate Lua syntax
        shell: sh
        run: luac5.4 -p etc/boot.lua bin/POPSLDR/system.lua bin/POPSLDR/ui.lua bin/POPSLDR/images.lua

      - name: Compile project
        shell: sh
        run: make clean elfloader all

      - name: Check patch cleanliness
        shell: sh
        run: git diff --check

  commit-fix:
    name: Commit validated hardware follow-up
    needs:
      - host-validation
      - ps2-build-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: agent/fix-mmce-mx4-first-entry
          fetch-depth: 0

      - name: Apply hardware follow-up patch
        run: python3 tools/apply_storage_fix_v2.py

      - name: Remove temporary applicator
        run: |
          rm -f tools/apply_storage_fix_v2.py
          rm -f .github/workflows/apply-storage-fix-v2.yml

      - name: Commit and push
        run: |
          set -eu
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp src/luasystem.cpp bin/POPSLDR/system.lua tools/host_harness.py tools/apply_storage_fix_v2.py .github/workflows/apply-storage-fix-v2.yml
          git commit -m "fix(storage): restore lazy BDM startup and launch environment"
          git push origin HEAD:agent/fix-mmce-mx4-first-entry
