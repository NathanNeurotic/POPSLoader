name: POPSLoader 1.3.0 Release

# RiptOPL-style reproducible release: publish the exact passing CI artifact.
# Ember is upstream Beta-2, not a newly named Ember beta.
# The release is opt-in prerelease until physical PS2 validation is recorded.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev]

permissions:
  actions: read
  contents: write

concurrency:
  group: popsloader-1.3.0-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download the matching CI artifact
        uses: actions/download-artifact@v4
        with:
          name: POPSLOADER
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify 1.3.0 ZIP, flat PSU and official Ember Beta-2
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=1.3.0
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          grep -Fxq 'POPSLDR_VER = "v1.3.0"' etc/boot.lua
          grep -Fxq 'Version=1.3.0' bin/POPSLDR/title.cfg
          test -s RELEASE_1.3.0.md
          test -s POPSLOADER.zip
          test -s PS1_POPSLOADER.psu
          unzip -tq POPSLOADER.zip
          mv POPSLOADER.zip PS1_POPSLOADER.zip
          # Ensure the unmodified bundled binary IS Gageformer's latest Beta-2,
          # including their 2026-09-28 asset replacement.
          REMOTE_TAG="$(gh api repos/Gageformer/Ember/releases/latest --jq .tag_name)"
          test "$REMOTE_TAG" = Beta-2
          REMOTE_DIGEST="$(gh api repos/Gageformer/Ember/releases/latest \
            --jq '[.assets[] | select(.name=="ember.elf")][0].digest')"
          case "$REMOTE_DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "No valid official Ember digest" >&2; exit 1 ;; esac
          export REMOTE_DIGEST
          python3 - <<'PY'
          import hashlib, os, pathlib, struct, subprocess, tempfile, zipfile
          expected = {"POPSLOADER.ELF", "POPSTARTER.ELF", "icon.sys",
                      "list.icn", "copy.icn", "del.icn", "title.cfg", "APPINFO.PBT"}
          with zipfile.ZipFile("PS1_POPSLOADER.zip") as z:
              assert z.testzip() is None
              entries = set(z.namelist())
              assert {n for n in entries if n.startswith("APPS/PS1_POPSLOADER/") and not n.endswith("/")} == {
                "APPS/PS1_POPSLOADER/" + n for n in expected}
              assert z.read("PS1_POPSLOADER.psu") == pathlib.Path("PS1_POPSLOADER.psu").read_bytes()
              for required in ("POPS/POPSTARTER.ELF", "POPS/PATCH_5.BIN", "EMBER/ember.elf",
                               "EMBER/LICENSE-BETA.txt", "EMBER/games/ExampleGame/ExampleGame.cue",
                               "EMBER/games/ExampleGame/ExampleGame.bin"):
                  assert required in entries, required
              assert not any(p.lower().endswith("/bios.bin") for p in entries)
              assert not z.read("EMBER/games/ExampleGame/ExampleGame.bin")
              assert b"Version=1.3.0" in z.read("APPS/PS1_POPSLOADER/title.cfg")
              elf = z.read("EMBER/ember.elf")
              assert elf[:6] == b"\x7fELF\x01\x01" and struct.unpack_from("<H", elf, 18)[0] == 8
              digest = hashlib.sha256(elf).hexdigest()
              assert "sha256:"+digest == os.environ["REMOTE_DIGEST"], (
                  "Bundled Ember does NOT match official Beta-2. Update source pin before releasing.",
                  digest, os.environ["REMOTE_DIGEST"])
              with tempfile.TemporaryDirectory() as d:
                  for name in expected:
                      pathlib.Path(d, name).write_bytes(z.read("APPS/PS1_POPSLOADER/"+name))
                  subprocess.run(["python3", "tools/package_psu.py", "verify", d,
                                  "PS1_POPSLOADER.psu"], check=True)
              pathlib.Path("POPSLOADER.ELF").write_bytes(z.read("APPS/PS1_POPSLOADER/POPSLOADER.ELF"))
          print("PASS: POPSLoader 1.3.0, unmodified official Ember Beta-2, exact 8-file PSU")
          PY
          {
            echo "POPSLoader 1.3.0 (upstream Ember Beta-2)"
            echo "Source: $VERIFIED_SHA"
            echo "CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$CI_RUN"
            echo "Not hardware certified; Ember remains experimental"
          } > BUILD-MANIFEST.txt
          sha256sum PS1_POPSLOADER.zip PS1_POPSLOADER.psu POPSLOADER.ELF BUILD-MANIFEST.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish one versioned POPSLoader release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh release view 1.3.0 >/dev/null 2>&1; then
            echo "1.3.0 already published. Preserving immutable versioned assets."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin refs/tags/1.3.0 >/dev/null 2>&1; then
            echo "::error::Tag 1.3.0 already exists; refusing unexpected retag."
            exit 1
          fi
          gh release create 1.3.0 \
            PS1_POPSLOADER.zip PS1_POPSLOADER.psu POPSLOADER.ELF \
            BUILD-MANIFEST.txt SHA256SUMS.txt \
            --target "$VERIFIED_SHA" \
            --title "POPSLoader 1.3.0 — Ember Beta-2" \
            --notes-file RELEASE_1.3.0.md \
            --prerelease --latest=false
          gh release view 1.3.0 --json url,tagName,isPrerelease,assets \
            --jq '{url:.url,tag:.tagName,prerelease:.isPrerelease,assets:[.assets[].name]}'
