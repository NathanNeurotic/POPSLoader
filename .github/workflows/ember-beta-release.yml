name: Ember Beta 1 Release (CI-verified)

# A single immutable, opt-in Ember preview from the exact CI-tested dev SHA.
# This file lives on default master because workflow_run executes from master.
# It NEVER updates the official stable release tag, defaults or master binary.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev]

permissions:
  actions: read
  contents: write

concurrency:
  group: popsloader-ember-beta-1-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact passing CI SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download installable kit from same successful CI run
        uses: actions/download-artifact@v4
        with:
          name: POPSLOADER
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify identity, the full ZIP and the exact PSU
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          TAG=1.3.0-ember-beta.1
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          grep -Fxq 'POPSLDR_VER = "v1.3.0-ember-beta.1"' etc/boot.lua
          grep -Fxq 'Version=1.3.0-ember-beta.1' bin/POPSLDR/title.cfg
          test -s EMBER_BETA_NOTES.md
          test -s POPSLOADER.zip
          test -s PS1_POPSLOADER.psu
          unzip -tq POPSLOADER.zip
          mv POPSLOADER.zip PS1_POPSLOADER.zip
          python3 - <<'PY'
          import pathlib, struct, subprocess, tempfile, zipfile
          names = {"POPSLOADER.ELF", "POPSTARTER.ELF", "icon.sys", "list.icn",
                   "copy.icn", "del.icn", "title.cfg", "APPINFO.PBT"}
          with zipfile.ZipFile("PS1_POPSLOADER.zip") as z:
              paths = set(z.namelist())
              assert z.testzip() is None
              app = {n for n in paths if n.startswith("APPS/PS1_POPSLOADER/") and not n.endswith("/")}
              assert app == {"APPS/PS1_POPSLOADER/" + n for n in names}, app
              assert z.read("PS1_POPSLOADER.psu") == pathlib.Path("PS1_POPSLOADER.psu").read_bytes()
              for required in ("POPS/PATCH_5.BIN", "POPS/POPSTARTER.ELF",
                               "EMBER/ember.elf", "EMBER/LICENSE-BETA.txt",
                               "EMBER/games/ExampleGame/ExampleGame.cue",
                               "EMBER/games/ExampleGame/ExampleGame.bin"):
                  assert required in paths, required
              assert not any(n.lower().endswith("/bios.bin") for n in paths)
              assert not z.read("EMBER/games/ExampleGame/ExampleGame.bin"), "Example must be empty"
              assert b"Version=1.3.0-ember-beta.1" in z.read("APPS/PS1_POPSLOADER/title.cfg")
              ember = z.read("EMBER/ember.elf")
              assert ember[:6] == b"\x7fELF\x01\x01" and struct.unpack_from("<H", ember, 18)[0] == 8
              assert 65536 <= len(ember) <= 16*1024*1024
              with tempfile.TemporaryDirectory() as temp:
                  for n in names:
                      pathlib.Path(temp, n).write_bytes(z.read("APPS/PS1_POPSLOADER/"+n))
                  subprocess.run(["python3", "tools/package_psu.py", "verify",
                                  temp, "PS1_POPSLOADER.psu"], check=True)
              pathlib.Path("POPSLOADER.ELF").write_bytes(z.read("APPS/PS1_POPSLOADER/POPSLOADER.ELF"))
              print("PASS: Ember core, version, full kit, eight direct app files and flat PSU")
          PY
          test -s POPSLOADER.ELF
          {
            echo "POPSLoader 1.3.0 Ember Beta 1 — PRERELEASE / NOT HARDWARE-CERTIFIED"
            echo "Source: $VERIFIED_SHA"
            echo "CI run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID"
            echo "Package: PS1_POPSLOADER.zip and PS1_POPSLOADER.psu"
            echo "Ember licence: EMBER/LICENSE-BETA.txt in complete ZIP"
            echo "Official stable 1.2.3 is unchanged"
          } > BUILD-MANIFEST.txt
          sha256sum POPSLOADER.ELF PS1_POPSLOADER.zip PS1_POPSLOADER.psu BUILD-MANIFEST.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish once as an immutable Ember prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG=1.3.0-ember-beta.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Ember Beta 1 already released; no asset or tag changes."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists without matching release; refusing retag."
            exit 1
          fi
          gh release create "$TAG" \
            PS1_POPSLOADER.zip PS1_POPSLOADER.psu POPSLOADER.ELF \
            BUILD-MANIFEST.txt SHA256SUMS.txt \
            --target "$VERIFIED_SHA" \
            --title "POPSLoader 1.3.0 Ember Beta 1" \
            --notes-file EMBER_BETA_NOTES.md \
            --prerelease \
            --latest=false
          gh release view "$TAG" --json isPrerelease,tagName,url,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, url: .url, assets: [.assets[].name]}'
